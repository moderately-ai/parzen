[package]
name = "parzen-comparison-benchmarks"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Manual cross-crate TPE comparison harness"
license = "MIT OR Apache-2.0"

[dependencies]
dhat = { version = "=0.3.3", optional = true }
fastrand = "=2.5.0"
hyperopt = { version = "=0.0.17", features = ["ordered-float"] }
libc = "=0.2.189"
optimizer = { version = "=1.0.1", default-features = false }
ordered-float = "=4.6.0"
parzen = { version = "=0.3.0", path = "..", default-features = false }
rand = "=0.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tpe = "=0.3.1"
wait-timeout = "=0.2.1"

[features]
default = ["parzen-simd"]
dhat-heap = ["dep:dhat"]
parzen-simd = ["parzen/simd"]

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "deny"
