name: release-crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified crate version to crates.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.89.0
      - name: Require exact version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF" = "refs/tags/v$version"
          grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo publish --dry-run --locked
      - name: Build candidate and inventory
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.version.outputs.version }}
          cargo package --locked
          cargo package --list --locked > "$RUNNER_TEMP/parzen-$version.files"
          mv "$RUNNER_TEMP/parzen-$version.files" .
          cp "target/package/parzen-$version.crate" "parzen-$version.crate"
          sha256sum "parzen-$version.crate" > crates.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crates-io-candidate
          retention-days: 14
          if-no-files-found: error
          path: |
            parzen-*.crate
            parzen-*.files
            crates.sha256

  publish:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crates-io-candidate
          path: ${{ runner.temp }}/verified-candidate
      - name: Publish or verify immutable version
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF" = "refs/tags/v$version"
          test -f "$RUNNER_TEMP/verified-candidate/parzen-$version.crate"
          test -f "$RUNNER_TEMP/verified-candidate/parzen-$version.files"
          test -f "$RUNNER_TEMP/verified-candidate/crates.sha256"
          (
            cd "$RUNNER_TEMP/verified-candidate"
            sha256sum -c crates.sha256
          )
          expected=$(cut -d' ' -f1 "$RUNNER_TEMP/verified-candidate/crates.sha256")
          cargo package --locked
          rebuilt=$(sha256sum "target/package/parzen-$version.crate" | cut -d' ' -f1)
          test "$rebuilt" = "$expected"
          index=https://index.crates.io/pa/rz/parzen
          published=$(curl --fail --silent --show-error "$index" 2>/dev/null | jq -r "select(.vers == \"$version\") | .cksum" | tail -1 || true)
          if [[ -n "$published" ]]; then
            test "$published" = "$expected"
            echo "parzen@$version already exists with the verified checksum; skipping"
            exit 0
          fi
          cargo publish --locked
          for _ in {1..60}; do
            published=$(curl --fail --silent --show-error "$index" 2>/dev/null | jq -r "select(.vers == \"$version\") | .cksum" | tail -1 || true)
            [[ "$published" == "$expected" ]] && exit 0
            sleep 5
          done
          echo "parzen@$version did not reach the registry with the expected checksum" >&2
          exit 1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crates-io-candidate
          path: ${{ runner.temp }}/verified-candidate
      - name: Create or update release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          version=${tag#v}
          awk -v heading="## [$version]" '
            index($0, heading " - ") == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP"/verified-candidate/parzen-*.crate \
            "$RUNNER_TEMP"/verified-candidate/parzen-*.files \
            "$RUNNER_TEMP/verified-candidate/crates.sha256"
