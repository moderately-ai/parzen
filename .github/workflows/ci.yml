name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8
        with:
          tool: nextest
      - run: cargo nextest run --all-targets --all-features --locked
      - run: cargo check --no-default-features --locked
      - run: cargo test --no-default-features --locked

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
      - name: Install addlicense
        run: GOBIN="$CARGO_HOME/bin" go install github.com/google/addlicense@v1.2.0
      - run: cargo fmt --all -- --check
      - run: ./scripts/license-headers.sh check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked
      - name: Doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --doc --all-features --locked
      - name: Statistical optimizer quality
        run: cargo test --test quality --release --locked
      - name: Release bounded-history capacity
        run: cargo test --release sampler::history::tests::bounded_history_retains_exact_top_and_constant_capacity --locked
      - name: Packaged serde validation
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "parzen") | .version')
          cargo package --locked
          manifest="target/package/parzen-$version/Cargo.toml"
          test -f "$manifest"
          cargo test --manifest-path "$manifest" --locked \
            deserialization_cannot_bypass_distribution_validation

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - run: cargo publish --dry-run --locked
      - name: Record package inventory
        shell: bash
        run: |
          cargo package --list --locked > "$RUNNER_TEMP/parzen-package-files.txt"
          mv "$RUNNER_TEMP/parzen-package-files.txt" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parzen-package-files
          path: parzen-package-files.txt
