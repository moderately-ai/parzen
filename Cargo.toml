[package]
name = "parzen"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "High-performance Tree-structured Parzen Estimator for Bayesian optimization"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    "Thomas Santerre <opensource@moderately.ai>",
    "Moderately AI Inc. <opensource@moderately.ai>",
]
repository = "https://github.com/moderately-ai/parzen"
homepage = "https://github.com/moderately-ai/parzen"
documentation = "https://docs.rs/parzen"
keywords = ["optimization", "bayesian", "tpe", "hyperparameter", "search"]
categories = ["algorithms", "mathematics", "science"]
exclude = [".github/**", "comparison-benchmarks/**", "scripts/**"]

[dependencies]
hashbrown = "=0.17.1"
libm = "=0.2.16"
rand = "=0.9.3"
rand_distr = "=0.5.1"
serde = { version = "=1.0.228", features = ["derive"], optional = true }
smallvec = "=1.15.1"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "=1.11.0"
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }

[features]
default = ["serde"]
serde = ["dep:serde"]

[[bench]]
name = "suggestion"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
