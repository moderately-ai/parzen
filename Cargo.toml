[package]
name = "parzen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tree-structured Parzen Estimator for categorical Bayesian optimization"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    "Thomas Santerre <opensource@moderately.ai>",
    "Moderately AI Inc. <opensource@moderately.ai>",
]
repository = "https://github.com/moderately-ai/parzen"
homepage = "https://github.com/moderately-ai/parzen"
documentation = "https://docs.rs/parzen"
keywords = ["optimization", "bayesian", "tpe", "hyperparameter", "search"]
categories = ["algorithms", "mathematics", "science"]
exclude = [".github/**", "scripts/**"]

[dependencies]
rand = "=0.9.3"
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
